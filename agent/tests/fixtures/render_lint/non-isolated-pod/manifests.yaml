# Namespace open : aucune NetworkPolicy. Chaque gabarit du genre examiné est signalé ; les autres
# genres et groupes sont silencieux.
apiVersion: apps/v1
kind: Deployment
metadata: {name: open-dep, namespace: open}
spec:
  replicas: 1
  selector: {matchLabels: {app: open-dep}}
  template:
    metadata: {labels: {app: open-dep}}
    spec: {containers: [{name: web, image: "registry.example.test/web:1.4.2"}]}
---
apiVersion: apps/v1beta1
kind: Deployment
metadata: {name: open-beta, namespace: open}
spec:
  replicas: 1
  selector: {matchLabels: {app: open-beta}}
  template:
    metadata: {labels: {app: open-beta}}
    spec: {containers: [{name: web, image: "registry.example.test/web:1.4.2"}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: open-sts, namespace: open}
spec:
  serviceName: open-sts
  replicas: 1
  selector: {matchLabels: {app: open-sts}}
  template:
    metadata: {labels: {app: open-sts}}
    spec: {containers: [{name: db, image: "registry.example.test/db:16.2"}]}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: open-ds, namespace: open}
spec:
  selector: {matchLabels: {app: open-ds}}
  template:
    metadata: {labels: {app: open-ds}}
    spec: {containers: [{name: agent, image: "registry.example.test/agent:2.0.0"}]}
---
apiVersion: apps/v1
kind: ReplicaSet
metadata: {name: open-rs, namespace: open}
spec:
  replicas: 1
  selector: {matchLabels: {app: open-rs}}
  template:
    metadata: {labels: {app: open-rs}}
    spec: {containers: [{name: web, image: "registry.example.test/web:1.4.2"}]}
---
apiVersion: batch/v1
kind: Job
metadata: {name: open-job, namespace: open}
spec:
  template:
    metadata: {labels: {app: open-job}}
    spec: {restartPolicy: Never, containers: [{name: migrate, image: "registry.example.test/migrate:3.1.0"}]}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: open-cron, namespace: open}
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        metadata: {labels: {app: open-cron}}
        spec: {restartPolicy: Never, containers: [{name: nightly, image: "registry.example.test/nightly:1.0.0"}]}
---
apiVersion: batch/v1beta1
kind: CronJob
metadata: {name: open-cron-beta, namespace: open}
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        metadata: {labels: {app: open-cron-beta}}
        spec: {restartPolicy: Never, containers: [{name: nightly, image: "registry.example.test/nightly:1.0.0"}]}
---
apiVersion: v1
kind: ReplicationController
metadata: {name: open-rc, namespace: open}
spec:
  replicas: 1
  selector: {app: open-rc}
  template:
    metadata: {labels: {app: open-rc}}
    spec: {containers: [{name: web, image: "registry.example.test/web:1.4.2"}]}
---
apiVersion: v1
kind: Pod
metadata: {name: open-pod, namespace: open, labels: {app: open-pod}}
spec: {containers: [{name: web, image: "registry.example.test/web:1.4.2"}]}
---
# Pod sans labels : non isolé, signalé.
apiVersion: v1
kind: Pod
metadata: {name: open-bare, namespace: open}
spec: {containers: [{name: web, image: "registry.example.test/web:1.4.2"}]}
---
