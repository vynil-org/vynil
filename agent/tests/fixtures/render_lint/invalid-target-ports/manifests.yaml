# Pod malformé (ports en chaîne) : ignoré en entier.
apiVersion: v1
kind: Pod
metadata: {name: pod-malformed, namespace: app}
spec:
  containers:
  - name: web
    image: "registry.example.test/web:1.4.2"
    ports: "oops"
---
# Services : targetPort chaîne, un constat par sous-règle violée.
apiVersion: v1
kind: Service
metadata: {name: t-trail, namespace: app}
spec: {selector: {app: none}, ports: [{port: 80, targetPort: "ab-"}]}
---
apiVersion: v1
kind: Service
metadata: {name: t-double, namespace: app}
spec: {selector: {app: none}, ports: [{port: 80, targetPort: "a--b"}]}
---
apiVersion: v1
kind: Service
metadata: {name: t-digits, namespace: app}
spec: {selector: {app: none}, ports: [{port: 80, targetPort: "123"}]}
---
apiVersion: v1
kind: Service
metadata: {name: t-long, namespace: app}
spec: {selector: {app: none}, ports: [{port: 80, targetPort: "abcdefghijklmnop"}]}
---
apiVersion: v1
kind: Service
metadata: {name: t-upper, namespace: app}
spec: {selector: {app: none}, ports: [{port: 80, targetPort: "HTTP"}]}
---
apiVersion: v1
kind: Service
metadata: {name: t-empty, namespace: app}
spec: {selector: {app: none}, ports: [{port: 80, targetPort: ""}]}
---
apiVersion: v1
kind: Service
metadata: {name: t-space, namespace: other}
spec: {ports: [{port: 80, targetPort: "a.b"}]}
---
# Conformes : nom valide de 15 caractères, chiffre et lettre, tiret interne, entier, absent.
apiVersion: v1
kind: Service
metadata: {name: t-ok-15, namespace: app}
spec: {selector: {app: none}, ports: [{port: 80, targetPort: "abcdefghijklmno"}]}
---
apiVersion: v1
kind: Service
metadata: {name: t-ok-hyphen, namespace: app}
spec: {selector: {app: none}, ports: [{port: 80, targetPort: "h-t-t-p"}]}
---
apiVersion: v1
kind: Service
metadata: {name: t-ok-int, namespace: app}
spec: {selector: {app: none}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: t-ok-absent, namespace: app}
