---
# Hors scope : nom du port de service (non examiné) et Service d'un groupe tiers.
apiVersion: v1
kind: Service
metadata: {name: t-svc-portname, namespace: app}
spec: {selector: {app: none}, ports: [{port: 80, name: "Bad_Name"}]}
---
apiVersion: example.io/v1
kind: Service
metadata: {name: tiers-svc, namespace: app}
