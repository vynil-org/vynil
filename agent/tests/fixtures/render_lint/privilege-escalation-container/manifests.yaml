apiVersion: apps/v1
kind: Deployment
metadata:
  name: conforme
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels: {app: conforme}
  template:
    metadata:
      labels: {app: conforme}
    spec:
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: escalade-autorisee
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels: {app: escalade-autorisee}
  template:
    metadata:
      labels: {app: escalade-autorisee}
    spec:
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
          securityContext:
            allowPrivilegeEscalation: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: escalade-init
  namespace: app
spec:
  serviceName: escalade-init
  replicas: 1
  selector:
    matchLabels: {app: escalade-init}
  template:
    metadata:
      labels: {app: escalade-init}
    spec:
      initContainers:
        - name: prepare
          image: registry.example.test/tools:2.0.0
          securityContext:
            allowPrivilegeEscalation: true
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: privilegie
  namespace: app
spec:
  selector:
    matchLabels: {app: privilegie}
  template:
    metadata:
      labels: {app: privilegie}
    spec:
      containers:
        - name: agent
          image: registry.example.test/agent:3.1.0
          securityContext:
            privileged: true
            allowPrivilegeEscalation: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sys-admin
  namespace: app
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: tache
          image: registry.example.test/tache:1.0.0
          securityContext:
            capabilities:
              add: [SYS_ADMIN]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sys-admin-prefixe
  namespace: app
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: tache
              image: registry.example.test/tache:1.0.0
              securityContext:
                capabilities:
                  add: [CAP_SYS_ADMIN]
---
apiVersion: v1
kind: Pod
metadata:
  name: deux-conteneurs
  namespace: app
spec:
  containers:
    - name: principal
      image: registry.example.test/web:1.4.2
      securityContext:
        allowPrivilegeEscalation: true
    - name: secondaire
      image: registry.example.test/web:1.4.2
      securityContext:
        allowPrivilegeEscalation: true
---
apiVersion: v1
kind: Pod
metadata:
  name: contexte-sans-champ
  namespace: app
spec:
  containers:
    - name: web
      image: registry.example.test/web:1.4.2
      securityContext:
        runAsNonRoot: true
---
apiVersion: v1
kind: Pod
metadata:
  name: privilegie-et-sys-admin
  namespace: app
spec:
  containers:
    - name: web
      image: registry.example.test/web:1.4.2
      securityContext:
        privileged: true
        capabilities:
          add: [SYS_ADMIN]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pas-un-workload
  namespace: app
data:
  allowPrivilegeEscalation: "true"
