# Services du namespace app : types exposés (NodePort, LoadBalancer par défaut) et non exposés.
apiVersion: v1
kind: Service
metadata: {name: nodeport, namespace: app}
spec: {type: NodePort, selector: {app: web}, ports: [{port: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: loadbalancer, namespace: app}
spec: {type: LoadBalancer, selector: {app: web}, ports: [{port: 80}]}
---
# Casse : la comparaison des types ignore la casse (mesuré).
apiVersion: v1
kind: Service
metadata: {name: nodeport-lower, namespace: app}
spec: {type: nodeport, selector: {app: web}, ports: [{port: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: loadbalancer-upper, namespace: app}
spec: {type: LOADBALANCER, selector: {app: web}, ports: [{port: 80}]}
---
# Namespace différent : le type est examiné quel que soit le namespace.
apiVersion: v1
kind: Service
metadata: {name: nodeport-other, namespace: other}
spec: {type: NodePort, selector: {app: web}, ports: [{port: 80}]}
---
# Conformes : ClusterIP, type absent, type vide, ExternalName, type inconnu.
apiVersion: v1
kind: Service
metadata: {name: clusterip, namespace: app}
spec: {type: ClusterIP, selector: {app: web}, ports: [{port: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: notype, namespace: app}
spec: {selector: {app: web}, ports: [{port: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: emptytype, namespace: app}
spec: {type: "", selector: {app: web}, ports: [{port: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: externalname, namespace: app}
spec: {type: ExternalName, externalName: example.com}
---
apiVersion: v1
kind: Service
metadata: {name: bogus-type, namespace: app}
spec: {type: Bogus, selector: {app: web}, ports: [{port: 80}]}
---
# Hors scope : un Service d'un groupe tiers homonyme est ignoré ; un Pod n'est pas un Service.
apiVersion: example.io/v1
kind: Service
metadata: {name: tiers-nodeport, namespace: app}
spec: {type: NodePort, selector: {app: web}, ports: [{port: 80}]}
---
apiVersion: v1
kind: Pod
metadata: {name: pod-nodeport, namespace: app}
spec:
  containers: [{name: web, image: "registry.example.test/web:1.4.2"}]
---
# Mal formé (type entier) : ignoré.
apiVersion: v1
kind: Service
metadata: {name: malformed-type, namespace: app}
spec: {type: 4, selector: {app: web}, ports: [{port: 80}]}
