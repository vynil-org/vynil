apiVersion: apps/v1
kind: Deployment
metadata:
  name: conforme
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels: {app: conforme}
  template:
    metadata:
      labels: {app: conforme}
    spec:
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
          securityContext:
            privileged: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: privilegie
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels: {app: privilegie}
  template:
    metadata:
      labels: {app: privilegie}
    spec:
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
          securityContext:
            privileged: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: privilegie-init
  namespace: app
spec:
  serviceName: privilegie-init
  replicas: 1
  selector:
    matchLabels: {app: privilegie-init}
  template:
    metadata:
      labels: {app: privilegie-init}
    spec:
      initContainers:
        - name: prepare
          image: registry.example.test/tools:2.0.0
          securityContext:
            privileged: true
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: non-privilegie
  namespace: app
spec:
  selector:
    matchLabels: {app: non-privilegie}
  template:
    metadata:
      labels: {app: non-privilegie}
    spec:
      containers:
        - name: agent
          image: registry.example.test/agent:3.1.0
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tache-privilegiee
  namespace: app
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: tache
          image: registry.example.test/tache:1.0.0
          securityContext:
            privileged: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-privilegie
  namespace: app
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: tache
              image: registry.example.test/tache:1.0.0
              securityContext:
                privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: privilegie-et-escalade
  namespace: app
spec:
  containers:
    - name: web
      image: registry.example.test/web:1.4.2
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pas-un-workload
  namespace: app
data:
  privileged: "true"
