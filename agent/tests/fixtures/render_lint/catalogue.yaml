# Inventaire des vérifications de l'oracle (kube-linter v0.8.3), attribuées à un thème.
# Généré depuis `kube-linter checks list --format json` ; ne pas éditer à la main sans relancer
# le test d'inventaire (lint_oracle.rs).
oracle_version: v0.8.3
checks:
  - name: access-to-create-pods
    theme: rbac
    status: ported
  - name: access-to-secrets
    theme: rbac
    status: ported
  - name: cluster-admin-role-binding
    theme: rbac
    status: ported
  - name: dangling-horizontalpodautoscaler
    theme: workload
    status: ported
  - name: dangling-ingress
    theme: network
    status: ported
  - name: dangling-networkpolicy
    theme: network
    status: ported
  - name: dangling-networkpolicypeer-podselector
    theme: network
    status: ported
  - name: dangling-service
    theme: network
    status: ported
  - name: dangling-servicemonitor
    theme: network
    status: ported
  - name: default-service-account
    theme: pod
    status: ported
  - name: deprecated-service-account-field
    theme: workload
    status: ported
  - name: dnsconfig-options
    theme: pod
    status: ported
  - name: docker-sock
    theme: pod
    status: ported
  - name: drop-net-raw-capability
    theme: pod
    status: ported
  - name: duplicate-env-var
    theme: pod
    status: ported
  - name: env-value-from
    theme: pod
    status: ported
  - name: env-var-secret
    theme: pod
    status: ported
  - name: exposed-services
    theme: network
    status: ported
  - name: host-ipc
    theme: pod
    status: ported
  - name: host-network
    theme: pod
    status: ported
  - name: host-pid
    theme: pod
    status: ported
  - name: hpa-minimum-three-replicas
    theme: workload
    status: ported
  - name: invalid-target-ports
    theme: network
    status: ported
  - name: job-ttl-seconds-after-finished
    theme: workload
    status: ported
  - name: latest-tag
    theme: pod
    status: ported
  - name: liveness-port
    theme: pod
    status: ported
  - name: minimum-three-replicas
    theme: workload
    status: ported
  - name: mismatching-selector
    theme: workload
    status: ported
  - name: no-anti-affinity
    theme: workload
    status: ported
  - name: no-extensions-v1beta
    theme: workload
    status: ported
  - name: no-liveness-probe
    theme: pod
    status: ported
  - name: no-node-affinity
    theme: workload
    status: ported
  - name: no-read-only-root-fs
    theme: pod
    status: ported
  - name: no-readiness-probe
    theme: pod
    status: ported
  - name: no-rolling-update-strategy
    theme: workload
    status: ported
  - name: non-existent-service-account
    theme: rbac
    status: deferred
    reason: "dépend des objets ServiceAccount de la liste d'objets : à porter avec le lot rbac, une fois décidé si la liste du test les contient"
  - name: non-isolated-pod
    theme: network
    status: ported
  - name: pdb-max-unavailable
    theme: workload
    status: ported
  - name: pdb-min-available
    theme: workload
    status: ported
  - name: pdb-unhealthy-pod-eviction-policy
    theme: workload
    status: ported
  - name: priority-class-name
    theme: pod
    status: ported
  - name: privilege-escalation-container
    theme: pod
    status: ported
  - name: privileged-container
    theme: pod
    status: ported
  - name: privileged-ports
    theme: pod
    status: ported
  - name: read-secret-from-env-var
    theme: pod
    status: ported
  - name: readiness-port
    theme: pod
    status: ported
  - name: required-annotation-email
    theme: workload
    status: ported
  - name: required-label-owner
    theme: workload
    status: ported
  - name: restart-policy
    theme: pod
    status: ported
  - name: run-as-non-root
    theme: pod
    status: ported
  - name: scc-deny-privileged-container
    theme: pod
    status: deferred
    reason: "dépend de la CRD tierce SecurityContextConstraints (OpenShift), absente de la liste d'objets par défaut"
  - name: schema-validation
    theme: pod
    status: excluded
    reason: "couvert par la bibliothèque render_lint_schema (schema_validate), composée séparément par la distribution, hors de @all"
  - name: sensitive-host-mounts
    theme: pod
    status: ported
  - name: sorted-keys
    theme: workload
    status: deferred
    reason: "ordre des clés perdu avant la vérification : les objets de lint sont des cartes Rhai (BTreeMap, keys() trié) ; mesuré : yaml_decode et yaml_decode_multi sur `b: 1` puis `a: 2` donnent keys() = [a, b], et une carte littérale ou JSON aussi ; seul yaml_decode_ordered garde l'ordre ([b, a]) mais ce n'est pas le type des objets de lint. kube-linter lit l'ordre source (signale `Keys are not sorted at root`), impossible à reproduire fidèlement"
  - name: ssh-port
    theme: pod
    status: ported
  - name: startup-port
    theme: pod
    status: ported
  - name: unsafe-proc-mount
    theme: pod
    status: ported
  - name: unsafe-sysctls
    theme: pod
    status: ported
  - name: unset-cpu-requirements
    theme: pod
    status: ported
  - name: unset-memory-requirements
    theme: pod
    status: ported
  - name: use-namespace
    theme: workload
    status: ported
  - name: wildcard-in-rules
    theme: rbac
    status: ported
  - name: writable-host-mount
    theme: pod
    status: ported
