# Conforme : Job autonome avec un TTL.
apiVersion: batch/v1
kind: Job
metadata: {name: job-ttl, namespace: app}
spec:
  ttlSecondsAfterFinished: 100
  template:
    metadata: {labels: {app: job-ttl}}
    spec: {restartPolicy: Never, containers: [{name: migrate, image: "registry.example.test/migrate:3.1.0"}]}
---
# Conforme : TTL à zéro est une valeur renseignée.
apiVersion: batch/v1
kind: Job
metadata: {name: job-ttl0, namespace: app}
spec:
  ttlSecondsAfterFinished: 0
  template:
    metadata: {labels: {app: job-ttl0}}
    spec: {restartPolicy: Never, containers: [{name: migrate, image: "registry.example.test/migrate:3.1.0"}]}
---
# Conforme : CronJob sans TTL dans le gabarit de son Job.
apiVersion: batch/v1
kind: CronJob
metadata: {name: cron-nottl, namespace: app}
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        metadata: {labels: {app: cron-nottl}}
        spec: {restartPolicy: Never, containers: [{name: nightly, image: "registry.example.test/nightly:1.0.0"}]}
---
# Conforme : CronJob dont le TTL est explicitement nul (valeur absente).
apiVersion: batch/v1
kind: CronJob
metadata: {name: cron-ttlnull, namespace: app}
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      ttlSecondsAfterFinished:
      template:
        metadata: {labels: {app: cron-ttlnull}}
        spec: {restartPolicy: Never, containers: [{name: nightly, image: "registry.example.test/nightly:1.0.0"}]}
---
# Non conforme : Job autonome sans TTL.
apiVersion: batch/v1
kind: Job
metadata: {name: job-nottl, namespace: app}
spec:
  template:
    metadata: {labels: {app: job-nottl}}
    spec: {restartPolicy: Never, containers: [{name: migrate, image: "registry.example.test/migrate:3.1.0"}]}
---
# Non conforme : Job autonome dont le TTL est explicitement nul (valeur absente).
apiVersion: batch/v1
kind: Job
metadata: {name: job-ttlnull, namespace: app}
spec:
  ttlSecondsAfterFinished:
  template:
    metadata: {labels: {app: job-ttlnull}}
    spec: {restartPolicy: Never, containers: [{name: migrate, image: "registry.example.test/migrate:3.1.0"}]}
---
# Non conforme : CronJob avec un TTL dans le gabarit de son Job.
apiVersion: batch/v1
kind: CronJob
metadata: {name: cron-ttl, namespace: app}
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        metadata: {labels: {app: cron-ttl}}
        spec: {restartPolicy: Never, containers: [{name: nightly, image: "registry.example.test/nightly:1.0.0"}]}
---
# Non conforme : CronJob avec un TTL à zéro dans le gabarit de son Job.
apiVersion: batch/v1
kind: CronJob
metadata: {name: cron-ttl0, namespace: app}
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 0
      template:
        metadata: {labels: {app: cron-ttl0}}
        spec: {restartPolicy: Never, containers: [{name: nightly, image: "registry.example.test/nightly:1.0.0"}]}
---
# Hors scope : Deployment, Pod et Service ne sont pas des Jobs.
apiVersion: apps/v1
kind: Deployment
metadata: {name: web-dep, namespace: app}
spec:
  replicas: 3
  selector: {matchLabels: {app: web-dep}}
  template:
    metadata: {labels: {app: web-dep}}
    spec: {containers: [{name: web, image: "registry.example.test/web:1.4.2"}]}
---
apiVersion: v1
kind: Pod
metadata: {name: solo-pod, namespace: app}
spec:
  containers: [{name: web, image: "registry.example.test/web:1.4.2"}]
---
apiVersion: v1
kind: Service
metadata: {name: web-svc, namespace: app}
spec:
  selector: {app: web-dep}
  ports: [{port: 80}]
