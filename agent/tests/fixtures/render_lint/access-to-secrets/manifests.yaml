# Accès aux secrets (mesuré sur kube-linter v0.8.3) : un RoleBinding désigne un Role de MÊME
# namespace par son seul nom (roleRef.kind et apiGroup ignorés, jamais un ClusterRole) ; un
# ClusterRoleBinding désigne un ClusterRole par son seul nom (namespace et apiGroup ignorés, roleRef.kind
# ignoré, jamais un Role). Une liaison est signalée une fois, quelles que soient ses règles
# concordantes. Une règle concorde quand un de ses verbes ET une de ses ressources concordent (la
# paire doit être dans la même règle) ; "*" concorde avec tout ; la liste par défaut contient "^*$",
# qui concorde avec tout verbe. Les objets v1beta1 et les groupes tiers sont ignorés.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: s-get, namespace: app}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: s-list, namespace: app}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: s-update, namespace: app}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: s-foo, namespace: app}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["foo"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: s-star-verb, namespace: app}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: s-star-resource, namespace: app}
rules:
- apiGroups: [""]
  resources: ["*"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: s-pods-get, namespace: app}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
