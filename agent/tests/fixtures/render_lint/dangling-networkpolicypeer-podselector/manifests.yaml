# Cibles du namespace app et d'un autre namespace : gabarits de pod de chaque genre résoluble.
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: app}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web, tier: front}}
    spec: {containers: [{name: web, image: "registry.example.test/web:1.4.2"}]}
---
apiVersion: v1
kind: Pod
metadata: {name: pod-x, namespace: app, labels: {app: podx}}
spec: {containers: [{name: web, image: "registry.example.test/web:1.4.2"}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db, namespace: app}
spec:
  serviceName: db
  replicas: 1
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec: {containers: [{name: db, image: "registry.example.test/db:16.2"}]}
---
apiVersion: extensions/v1beta1
kind: Deployment
metadata: {name: ext, namespace: app}
spec:
  replicas: 1
  selector: {matchLabels: {app: ext}}
  template:
    metadata: {labels: {app: ext}}
    spec: {containers: [{name: web, image: "registry.example.test/web:1.4.2"}]}
---
apiVersion: batch/v1
kind: Job
metadata: {name: migrate, namespace: app}
spec:
  template:
    metadata: {labels: {app: migrate}}
    spec: {restartPolicy: Never, containers: [{name: migrate, image: "registry.example.test/migrate:3.1.0"}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: meta-only, namespace: app, labels: {app: meta-only}}
spec:
  replicas: 1
  selector: {matchLabels: {app: meta-only}}
  template:
    metadata: {labels: {app: tpl-x}}
    spec: {containers: [{name: web, image: "registry.example.test/web:1.4.2"}]}
---
apiVersion: example.io/v1
kind: Deployment
metadata: {name: tiers, namespace: app}
spec:
  replicas: 1
  selector: {matchLabels: {app: tiers}}
  template:
    metadata: {labels: {app: tiers}}
    spec: {containers: [{name: web, image: "registry.example.test/web:1.4.2"}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: oth, namespace: other}
spec:
  replicas: 1
  selector: {matchLabels: {app: oth}}
  template:
    metadata: {labels: {app: oth}}
    spec: {containers: [{name: web, image: "registry.example.test/web:1.4.2"}]}
---
# Conformes : pairs qui visent une cible du namespace de la policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ok-from-web, namespace: app}
spec:
  podSelector: {}
  ingress:
  - from: [{podSelector: {matchLabels: {app: web}}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ok-from-pod-and-sts, namespace: app}
spec:
  podSelector: {}
  ingress:
  - from:
    - podSelector: {matchLabels: {app: podx}}
    - podSelector: {matchLabels: {app: db}}
    - podSelector: {matchLabels: {app: ext}}
    - podSelector: {matchLabels: {app: migrate}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ok-to-expression, namespace: app}
spec:
  podSelector: {}
  egress:
  - to: [{podSelector: {matchExpressions: [{key: app, operator: In, values: [db, nope]}]}}]
---
# Sélecteur vide : vise toute cible du namespace de la policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ok-from-empty-peer, namespace: app}
spec:
  podSelector: {}
  ingress:
  - from: [{podSelector: {}}]
---
# Pairs ignorées : namespaceSelector présent (même vide), ipBlock seul, namespaceSelector seul,
# pair sans podSelector, pas de from/to.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ignored-peers, namespace: app}
spec:
  podSelector: {}
  ingress:
  - from:
    - namespaceSelector: {}
      podSelector: {matchLabels: {app: nomatch}}
    - ipBlock: {cidr: 10.0.0.0/8}
    - namespaceSelector: {matchLabels: {team: x}}
    - {}
  - ports: [{port: 80}]
---
# Non conformes : une pair par constat, ingress et egress ; cible d'un autre namespace, cible sans
# le genre ou le groupe examiné, expression invalide.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ko-two-ingress-peers, namespace: app}
spec:
  podSelector: {}
  ingress:
  - from:
    - podSelector: {matchLabels: {app: nomatch1}}
    - podSelector: {matchLabels: {app: nomatch2}}
  egress:
  - to: [{podSelector: {matchLabels: {app: nomatch3}}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ko-from-nomatch, namespace: app}
spec:
  podSelector: {}
  ingress:
  - from: [{podSelector: {matchLabels: {app: nomatch}}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ko-other-namespace-target, namespace: app}
spec:
  podSelector: {}
  ingress:
  - from: [{podSelector: {matchLabels: {app: oth}}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ko-metadata-only, namespace: app}
spec:
  podSelector: {}
  ingress:
  - from: [{podSelector: {matchLabels: {app: meta-only}}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ko-tiers-group, namespace: app}
spec:
  podSelector: {}
  ingress:
  - from: [{podSelector: {matchLabels: {app: tiers}}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ko-operator, namespace: app}
spec:
  podSelector: {}
  egress:
  - to: [{podSelector: {matchExpressions: [{key: app, operator: Bogus, values: [web]}]}}]
---
# Namespace solo : sans cible, un sélecteur vide de pair n'a rien à viser.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ko-solo-empty-peer, namespace: solo}
spec:
  podSelector: {}
  ingress:
  - from: [{podSelector: {}}]
---
# Hors scope : groupe tiers, version v1beta1, et formes mal formées (ignorées en entier).
apiVersion: example.io/v1
kind: NetworkPolicy
metadata: {name: tiers-group, namespace: app}
spec:
  podSelector: {}
  ingress:
  - from: [{podSelector: {matchLabels: {app: nomatch}}}]
---
apiVersion: networking.k8s.io/v1beta1
kind: NetworkPolicy
metadata: {name: v1b1, namespace: app}
spec:
  podSelector: {}
  ingress:
  - from: [{podSelector: {matchLabels: {app: nomatch}}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: malformed-ingress, namespace: app}
spec:
  podSelector: {}
  ingress: "x"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: malformed-peer-labels, namespace: app}
spec:
  podSelector: {}
  ingress:
  - from: [{podSelector: {matchLabels: {app: 5}}}]
