# Création de pods et de charges de travail (mesuré sur kube-linter v0.8.3) : même moteur que
# access-to-secrets (voir son fichier), avec les ressources pods, deployments, statefulsets,
# replicasets, cronjob (singulier, tel quel), jobs, daemonsets et le verbe create. Une liaison
# signalée une fois ; "*" concorde avec tout ; `cronjobs` (pluriel) et `pod` (singulier) ne concordent pas.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: c-pods, namespace: app}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: c-deployments, namespace: app}
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
