  resources: ["replicasets"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: c-cronjob, namespace: app}
rules:
- apiGroups: ["batch"]
  resources: ["cronjob"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
