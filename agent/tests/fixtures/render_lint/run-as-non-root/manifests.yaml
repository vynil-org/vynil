apiVersion: apps/v1
kind: Deployment
metadata:
  name: conforme
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels: {app: conforme}
  template:
    metadata:
      labels: {app: conforme}
    spec:
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: herite-du-pod
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels: {app: herite-du-pod}
  template:
    metadata:
      labels: {app: herite-du-pod}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sans-securite
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels: {app: sans-securite}
  template:
    metadata:
      labels: {app: sans-securite}
    spec:
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: init-sans-securite
  namespace: app
spec:
  serviceName: init-sans-securite
  replicas: 1
  selector:
    matchLabels: {app: init-sans-securite}
  template:
    metadata:
      labels: {app: init-sans-securite}
    spec:
      initContainers:
        - name: prepare
          image: registry.example.test/tools:2.0.0
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
          securityContext:
            runAsNonRoot: true
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: racine-explicite
  namespace: app
spec:
  selector:
    matchLabels: {app: racine-explicite}
  template:
    metadata:
      labels: {app: racine-explicite}
    spec:
      containers:
        - name: agent
          image: registry.example.test/agent:3.1.0
          securityContext:
            runAsNonRoot: true
            runAsUser: 0
---
apiVersion: batch/v1
kind: Job
metadata:
  name: uid-zero-herite
  namespace: app
spec:
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 0
      containers:
        - name: tache
          image: registry.example.test/tache:1.0.0
          securityContext:
            runAsNonRoot: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: non-root-desactive
  namespace: app
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
          containers:
            - name: tache
              image: registry.example.test/tache:1.0.0
              securityContext:
                runAsNonRoot: false
---
apiVersion: v1
kind: Pod
metadata:
  name: conteneur-prime-sur-pod
  namespace: app
spec:
  securityContext:
    runAsNonRoot: false
  containers:
    - name: web
      image: registry.example.test/web:1.4.2
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-nu-sans-securite
  namespace: app
spec:
  containers:
    - name: web
      image: registry.example.test/web:1.4.2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pas-un-workload
  namespace: app
data:
  runAsNonRoot: "true"
