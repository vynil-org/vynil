---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: port-non-expose
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels: {app: non-expose}
  template:
    metadata:
      labels: {app: non-expose}
    spec:
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
