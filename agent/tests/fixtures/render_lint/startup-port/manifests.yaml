---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tcp-non-expose
  namespace: app
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: db
          image: registry.example.test/db:16
          ports:
            - containerPort: 5432
          startupProbe:
            tcpSocket: {port: 6379}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: init-port
  namespace: app
spec:
  selector:
    matchLabels: {app: agent}
  template:
    metadata:
      labels: {app: agent}
    spec:
      initContainers:
        - name: prepare
          image: registry.example.test/prepare:1.0.0
          ports:
            - containerPort: 7000
      containers:
        - name: agent
          image: registry.example.test/agent:1.0.0
          ports:
            - containerPort: 9100
          startupProbe:
            tcpSocket: {port: 9100}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-port-non-expose
  namespace: app
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: task
              image: registry.example.test/task:1.0.0
              ports:
                - containerPort: 8000
              startupProbe:
                httpGet: {path: /healthz, port: 8081}
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-nu-port
  namespace: app
spec:
  containers:
    - name: web
      image: registry.example.test/web:1.4.2
      ports:
        - containerPort: 8080
      startupProbe:
        httpGet: {path: /healthz, port: 7070}
---
apiVersion: apps/v1
