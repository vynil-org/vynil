apiVersion: apps/v1
kind: Deployment
metadata:
  name: conforme
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels: {app: conforme}
  template:
    metadata:
      labels: {app: conforme}
    spec:
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-tcp-implicite
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels: {app: ssh}
  template:
    metadata:
      labels: {app: ssh}
    spec:
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
          ports:
            - containerPort: 22
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-tcp-explicite
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels: {app: sshe}
  template:
    metadata:
      labels: {app: sshe}
    spec:
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
          ports:
            - containerPort: 22
              protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-udp
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels: {app: udp}
  template:
    metadata:
      labels: {app: udp}
    spec:
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
          ports:
            - containerPort: 22
              protocol: UDP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: init-ssh
  namespace: app
spec:
  serviceName: x
  replicas: 1
  selector:
    matchLabels: {app: init}
  template:
    metadata:
      labels: {app: init}
    spec:
      initContainers:
        - name: prepare
          image: registry.example.test/prepare:1.0.0
          ports:
            - containerPort: 22
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
          ports:
            - containerPort: 8080
              hostPort: 22
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-ssh
  namespace: app
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: task
              image: registry.example.test/task:1.0.0
              ports:
                - containerPort: 22
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-port-proche
  namespace: app
spec:
  containers:
    - name: web
      image: registry.example.test/web:1.4.2
      ports:
        - containerPort: 2222
        - containerPort: 23
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm
  namespace: app
data:
  port: "22"
