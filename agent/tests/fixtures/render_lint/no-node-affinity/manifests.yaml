# Conforme : affinité de nœud requise.
apiVersion: apps/v1
kind: Deployment
metadata: {name: ok-node, namespace: app}
spec:
  replicas: 3
  selector: {matchLabels: {app: ok-node}}
  template:
    metadata: {labels: {app: ok-node}}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: zone, operator: In, values: [a]}
      containers: [{name: web, image: "registry.example.test/web:1.4.2"}]
---
# Conforme : nodeAffinity présent, même vide.
apiVersion: apps/v1
kind: Deployment
metadata: {name: ok-node-empty, namespace: app}
spec:
  replicas: 3
  selector: {matchLabels: {app: ok-node-empty}}
  template:
    metadata: {labels: {app: ok-node-empty}}
    spec:
      affinity:
        nodeAffinity: {}
      containers: [{name: web, image: "registry.example.test/web:1.4.2"}]
---
# Non conforme : Deployment sans affinité.
apiVersion: apps/v1
kind: Deployment
metadata: {name: none-dep, namespace: app}
spec:
  replicas: 3
  selector: {matchLabels: {app: none-dep}}
  template:
    metadata: {labels: {app: none-dep}}
    spec: {containers: [{name: web, image: "registry.example.test/web:1.4.2"}]}
---
# Non conforme : seule une anti-affinité de pods est définie.
apiVersion: apps/v1
kind: Deployment
metadata: {name: pod-aa-only, namespace: app}
spec:
  replicas: 3
  selector: {matchLabels: {app: pod-aa-only}}
  template:
    metadata: {labels: {app: pod-aa-only}}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {app: pod-aa-only}}
      containers: [{name: web, image: "registry.example.test/web:1.4.2"}]
---
# Non conforme : StatefulSet sans affinité.
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db-sts, namespace: app}
spec:
  replicas: 3
  serviceName: db
  selector: {matchLabels: {app: db-sts}}
  template:
    metadata: {labels: {app: db-sts}}
    spec: {containers: [{name: db, image: "registry.example.test/db:16.2"}]}
---
# Non conforme : DaemonSet sans affinité.
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: agent-ds, namespace: app}
spec:
  selector: {matchLabels: {app: agent-ds}}
  template:
    metadata: {labels: {app: agent-ds}}
    spec: {containers: [{name: agent, image: "registry.example.test/agent:2.0.0"}]}
---
# Non conforme : ReplicaSet sans affinité.
apiVersion: apps/v1
kind: ReplicaSet
metadata: {name: rs-plain, namespace: app}
spec:
  replicas: 2
  selector: {matchLabels: {app: rs-plain}}
  template:
    metadata: {labels: {app: rs-plain}}
    spec: {containers: [{name: web, image: "registry.example.test/web:1.4.2"}]}
---
# Non conforme : ReplicationController sans affinité.
apiVersion: v1
kind: ReplicationController
metadata: {name: rc-plain, namespace: app}
spec:
  replicas: 2
  selector: {app: rc-plain}
  template:
    metadata: {labels: {app: rc-plain}}
    spec: {containers: [{name: web, image: "registry.example.test/web:1.4.2"}]}
---
# Non conforme : Job sans affinité.
apiVersion: batch/v1
kind: Job
metadata: {name: migrate-job, namespace: app}
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata: {labels: {app: migrate-job}}
    spec: {restartPolicy: Never, containers: [{name: migrate, image: "registry.example.test/migrate:3.1.0"}]}
---
# Non conforme : CronJob sans affinité.
apiVersion: batch/v1
kind: CronJob
metadata: {name: nightly-cron, namespace: app}
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        metadata: {labels: {app: nightly-cron}}
        spec: {restartPolicy: Never, containers: [{name: nightly, image: "registry.example.test/nightly:1.0.0"}]}
---
# Non conforme : Pod nu sans affinité.
apiVersion: v1
kind: Pod
metadata: {name: solo-pod, namespace: app}
spec:
  containers: [{name: web, image: "registry.example.test/web:1.4.2"}]
---
# Hors scope : Service et groupe extensions/v1beta1.
apiVersion: v1
kind: Service
metadata: {name: web-svc, namespace: app}
spec:
  selector: {app: ok-node}
  ports: [{port: 80}]
---
apiVersion: extensions/v1beta1
kind: Deployment
metadata: {name: legacy-ext, namespace: app}
spec:
  replicas: 3
  selector: {matchLabels: {app: legacy-ext}}
  template:
    metadata: {labels: {app: legacy-ext}}
    spec: {containers: [{name: web, image: "registry.example.test/web:1.4.2"}]}
