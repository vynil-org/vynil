# Conforme : le secret est référencé (valueFrom) ou la valeur est vide ; un nom sans « secret ».
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-reference
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels: {app: secret-reference}
  template:
    metadata:
      labels: {app: secret-reference}
    spec:
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
          env:
            - {name: "DB_PASSWORD", value: "motdepasse"}
            - {name: "API_TOKEN_SECRET", valueFrom: {secretKeyRef: {name: api, key: token}}}
            - {name: "EMPTY_SECRET", value: ""}
            - {name: "LOG_LEVEL", value: "info"}
---
# Non conformes : valeur littérale sous un nom contenant « secret » (casse indifférente).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-litteral
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels: {app: secret-litteral}
  template:
    metadata:
      labels: {app: secret-litteral}
    spec:
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
          env:
            - {name: "DB_SECRET", value: "x"}
            - {name: "api_secret", value: "k"}
---
# Non conforme : dans un conteneur d'initialisation.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: secret-init
  namespace: app
spec:
  serviceName: secret-init
  replicas: 1
  selector:
    matchLabels: {app: secret-init}
  template:
    metadata:
      labels: {app: secret-init}
    spec:
      initContainers:
        - name: init
          image: registry.example.test/init:1.0.0
          env:
            - {name: "PLAIN_SECRET_NAME", value: "v"}
      containers:
        - name: web
          image: registry.example.test/web:1.4.2
---
# Non conforme : pod nu.
apiVersion: v1
kind: Pod
metadata:
  name: pod-secret
  namespace: app
spec:
  containers:
    - name: web
      image: registry.example.test/web:1.4.2
      env:
        - {name: "MY_SECRET_LIKE", value: "s"}
---
# Non conforme : CronJob.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-secret
  namespace: app
spec:
  schedule: "0 7 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: task
              image: registry.example.test/task:1.0.0
              env:
                - {name: "SMTP_SECRET", value: "p"}
---
# Non-workload : silencieux, même avec une valeur qui ressemble à un secret.
apiVersion: v1
kind: Secret
metadata:
  name: api
  namespace: app
type: Opaque
stringData:
  token: "abc"
