apiVersion: v1
kind: Pod
metadata:
  name: init-latest
  namespace: app
spec:
  initContainers:
    - name: prepare
      image: busybox:latest
  containers:
    - name: main
      image: busybox:1.36
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-latest
  namespace: app
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: task
              image: alpine:latest
---
