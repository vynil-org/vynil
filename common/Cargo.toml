[package]
name = "common"
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vynil-core = { version = "0.8.0", features = ["k8s", "oci", "s3", "fs", "shell", "password"] }
k8s-openapi.workspace = true
kube.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
rust-yaml.workspace = true
serde_yaml.workspace = true
indexmap = "2"
tokio.workspace = true
chrono.workspace = true
schemars.workspace = true
actix-web.workspace = true
base64.workspace = true
thiserror = "2.0.3"
handlebars = { version = "6.2.0", features = ["script_helper", "string_helpers"] }
handlebars_misc_helpers = { version = "0.17.0", features = ["string", "json", "jsonnet", "regex", "uuid"] }
rhai = { version = "1.20.0", features = ["sync", "serde", "internals"] }
reqwest = { version = "0.12.24", features = ["rustls-tls"] }
futures = "0.3"
rand = "0.10.1"
lazy_static = "1.5.0"
regex = "1.12.2"
semver = { version = "1.0.24", features = ["serde"] }
tar = "0.4.46"
flate2 = "1.1.4"
openapiv3 = "2.0.0"
sha256 = "1.5.0"
argon2 = { version = "0.5.3", features = ["std"] }
bcrypt = "0.19.2"
crc32fast = "1.5.0"
url = "2.5.4"
http = "1.1.0"
wildmatch = "2.6.1"
openssl = "0.10.73"

[dev-dependencies]
tower-test = "0.4.0"
tempfile = "3"
wiremock = "0.6"

[lib]
name = "common"
path = "src/lib.rs"

[lints]
workspace = true
