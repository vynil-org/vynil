version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Cargo workspace: a single Cargo.lock at the root covers every member crate
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "cargo"
    groups:
      kube-stack:
        patterns:
          - "kube"
          - "kube-*"
          - "k8s-openapi"
